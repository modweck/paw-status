[build]
  command = "npm run build"
  publish = "apps/web/dist"
  functions = "apps/web/netlify/functions"

[[redirects]]
  from = "/api/groomer-photo"
  to = "/.netlify/functions/groomer-photo"
  status = 200

[[redirects]]
  from = "/api/guest-booking"
  to = "/.netlify/functions/guest-booking"
  status = 200

[[redirects]]
  from = "/api/guest-booking-claim"
  to = "/.netlify/functions/guest-booking-claim"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
